services:
  chessbot:
    build: .
    image: chessbot:latest
    container_name: chessbot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      STOCKFISH_PATH: /usr/games/stockfish
      GRIT_PAWN_BIAS: ${GRIT_PAWN_BIAS:-65}
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
